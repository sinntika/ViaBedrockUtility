import org.oryxel.viabedrockutility.generator.EnumGeneratorTask;

plugins {
	id 'idea'
	// 26.2 ships deobfuscated, so the plain loom plugin replaces the remapping one.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

configurations {
	lib
	implementation.extendsFrom lib
	api.extendsFrom lib
}

loom {
	accessWidenerPath = file("src/main/resources/viabedrockutility.accesswidener")
}

repositories {
	maven {
		name = "Jitpack"
		url = "https://jitpack.io"

		content {
			includeGroup "com.github.Oryxel"
			// CubeConverter moved to the Oryxel1 account, which is where
			// ViaFabricPlus pulls it from.
			includeGroup "com.github.Oryxel1"
		}
	}

	maven {
		name = "ViaVersion"
		url = "https://repo.viaversion.com"

		content {
			includeGroup "com.viaversion"
			// ViaBedrock and ViaLegacy live under net.raphimc in the same repo.
			includeGroup "net.raphimc"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// No mappings entry: 26.2 is distributed with real names already.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Must match the CubeConverter that ViaFabricPlus jar-in-jars, because its
	// copy is a real mod and therefore wins over the one shaded in below. Compiling
	// against anything else turns API drift into runtime NoSuchMethodError, which is
	// exactly how GsonUtil.getGson() blew up on 26.2.
	lib("com.github.Oryxel1:CubeConverter:abecffaaea") {
		transitive = false
	}

	// Compile only, never shaded. CubeConverter's json entry points are typed
	// against the gson ViaVersion relocates into its own package, and javac has to
	// resolve every overload of a method that gets called, even the ones this mod
	// never picks. ViaFabricPlus ships the real copy at runtime.
	compileOnly("com.viaversion:viaversion-common:5.12.0-SNAPSHOT") {
		transitive = false
	}

	// Compile only, never shaded: ViaFabricPlus 4.6.2 jar-in-jars exactly this
	// build, so the classes are already on the runtime classpath. Pinned to the
	// same coordinate ViaFabricPlus declares, for the same reason CubeConverter is
	// pinned above.
	compileOnly("net.raphimc:ViaBedrock:0.0.29-20260720.172239-5") {
		transitive = false
	}

	// 1.18.36 dies on JDK 25 with NoSuchFieldException TypeTag :: UNKNOWN.
	lib 'org.projectlombok:lombok:1.18.46'
	annotationProcessor 'org.projectlombok:lombok:1.18.46'

	lib("team.unnamed:mocha:3.0.1") {
		transitive = false
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

// The mod ships an empty test source set. Gradle 9 fails the build in that case
// unless this is explicitly allowed.
tasks.withType(Test).configureEach {
	it.failOnNoDiscoveredTests = false
}

def enumSourceDir = layout.buildDirectory.dir("generated/enums/main/java")
def enumGeneratorTask = tasks.register("enumGeneratorTask", EnumGeneratorTask) {
	outputDirectory = enumSourceDir
}
tasks.compileJava.dependsOn(enumGeneratorTask)

sourceSets.main.java.srcDir(enumSourceDir)

idea {
	module {
		["run"].each {
			excludeDirs << file("$it")
		}
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	// withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}

	dependsOn configurations.lib
	from {
		duplicatesStrategy = DuplicatesStrategy.EXCLUDE
		configurations.lib.collect {
			zipTree(it)
		}
	}
}
