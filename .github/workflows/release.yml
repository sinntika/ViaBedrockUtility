name: release

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 and JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Build every supported target
        id: build
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p release-out ci
          : > ci/release-log.txt

          build() {
            branch="$1"
            label="$2"
            java_home="$3"

            echo "===== $label from $branch =====" >> ci/release-log.txt
            echo "java home: $java_home" >> ci/release-log.txt
            if ! git checkout --force "origin/$branch" >> ci/release-log.txt 2>&1; then
              echo "could not check out origin/$branch" >> ci/release-log.txt
              return 1
            fi

            chmod +x ./gradlew
            rm -rf build/libs
            JAVA_HOME="$java_home" PATH="$java_home/bin:$PATH" ./gradlew build --no-daemon --stacktrace > "ci/gradle-$label.log" 2>&1
            gradle_status=$?

            echo "-- gradle exit: $gradle_status --" >> ci/release-log.txt
            grep -E "error:|FAILURE|What went wrong|Caused by|BUILD " "ci/gradle-$label.log" | head -n 30 >> ci/release-log.txt
            echo "-- tail --" >> ci/release-log.txt
            tail -n 20 "ci/gradle-$label.log" >> ci/release-log.txt
            echo "-- build/libs --" >> ci/release-log.txt
            ls -l build/libs >> ci/release-log.txt 2>&1

            if [ "$gradle_status" -ne 0 ]; then
              return 1
            fi

            jar=""
            for candidate in build/libs/*.jar; do
              case "$candidate" in
                *-sources.jar) continue ;;
                *-dev.jar) continue ;;
                *"*"*) continue ;;
              esac
              jar="$candidate"
              break
            done

            if [ -z "$jar" ]; then
              echo "no publishable jar in build/libs" >> ci/release-log.txt
              return 1
            fi

            cp "$jar" "release-out/viabedrockutility-1.0.0+$label.jar"
            echo "picked $jar" >> ci/release-log.txt
          }

          overall=0
          build port/1.21.11 1.21.11 "${JAVA_HOME_21_X64:-$JAVA_HOME}" || overall=1
          build port/26.2 26.2 "${JAVA_HOME_25_X64:-$JAVA_HOME}" || overall=1

          echo "===== release-out =====" >> ci/release-log.txt
          ls -l release-out >> ci/release-log.txt 2>&1

          cat ci/release-log.txt
          exit $overall

      - name: Publish the release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "$(ls -A release-out 2>/dev/null)" ]; then
            echo "nothing to publish"
            exit 0
          fi

          tag="${GITHUB_REF_NAME#release/}"

          {
            echo "ViaBedrockUtility 1.0.0, built from one source tree for two Minecraft versions."
            echo
            echo "- viabedrockutility-1.0.0+1.21.11.jar for Minecraft 1.21.11"
            echo "- viabedrockutility-1.0.0+26.2.jar for Minecraft 26.2"
            echo
            echo "Both jars need Fabric API and ViaFabricPlus. Install only the jar that matches the instance you play on."
          } > release-notes.md

          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" release-out/*.jar --clobber
          else
            gh release create "$tag" release-out/*.jar --target "$GITHUB_SHA" --title "ViaBedrockUtility $tag" --notes-file release-notes.md
          fi

          echo "===== release =====" >> ci/release-log.txt
          gh release view "$tag" >> ci/release-log.txt 2>&1

      - name: Record the build log
        if: always()
        run: |
          set -uo pipefail
          git checkout --force -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/release-log.txt || true
          if git diff --cached --quiet; then
            echo "no log changes"
            exit 0
          fi
          git commit -m "ci: record the release build log [skip ci]"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"

      - name: Fail if a target did not build
        if: steps.build.outcome != 'success'
        run: exit 1
