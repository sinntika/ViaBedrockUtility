name: experimental

# Publishes the experimental custom block builds under a tag of their own.
#
# The release workflow is pinned to the port branches and to the 1.0.0 tag, so
# reusing it would replace the jars people already run. Pushing a
# release-experimental/<name> branch instead builds both variants of the feature
# branch and publishes them as a prerelease, leaving 1.0.0 untouched.
on:
  push:
    branches: ["release-experimental/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: experimental-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experimental:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build both variants
        run: |
          set -euo pipefail
          mkdir -p release-out
          build() {
            branch="$1"
            label="$2"
            echo "::group::$label from $branch"
            git checkout --force "origin/$branch"
            chmod +x ./gradlew
            ./gradlew clean build --no-daemon --stacktrace
            jar="$(ls build/libs/*.jar | grep -v -e '-sources' -e '-dev' | head -n 1)"
            cp "$jar" "release-out/viabedrockutility-1.0.0+26.2-$label.jar"
            echo "::endgroup::"
          }
          build feature/custom-blocks-safe safe
          build feature/custom-blocks blocks
          ls -l release-out

      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#release-experimental/}"
          notes="$(cat <<'EOF'
          Experimental builds for Minecraft 26.2. Both need ViaFabricPlus.

          - viabedrockutility-1.0.0+26.2-safe.jar
            Everything that is known to work: the startup crash fix, the custom
            payload fix, capes, skins and custom entities. Custom blocks are
            read from the packs but no block is registered, so nothing new can
            go wrong.

          - viabedrockutility-1.0.0+26.2-blocks.jar
            The same, plus the experimental custom blocks. Everything the blocks
            add is isolated so that a failure disables the blocks instead of the
            mod, but this build has not been played through yet.

          The stable 1.0.0 release is unaffected by both jars.
          EOF
          )"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-out/*.jar --clobber
          else
            gh release create "$tag" release-out/*.jar \
              --target "$GITHUB_SHA" \
              --title "ViaBedrockUtility $tag" \
              --prerelease \
              --notes "$notes"
          fi
          gh release view "$tag"
