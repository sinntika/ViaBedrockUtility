name: experimental

# Publishes the experimental custom block builds under a tag of their own.
#
# The release workflow is pinned to the port branches and to the 1.0.0 tag, so
# reusing it would replace the jars people already run. Pushing a
# release-experimental/<name> branch instead builds both variants of the feature
# branch and publishes them as a prerelease, leaving 1.0.0 untouched.
on:
  push:
    branches: ["release-experimental/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: experimental-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experimental:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build the safe variant
        run: |
          set -eu
          mkdir -p release-out
          git checkout --force origin/feature/custom-blocks-safe
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon --stacktrace
          ls -l build/libs
          jar=""
          for candidate in build/libs/*.jar; do
            case "$candidate" in
              *-sources.jar|*-dev.jar|*-dev-shadow.jar|*-sources-dev.jar) continue ;;
            esac
            jar="$candidate"
          done
          test -n "$jar"
          cp "$jar" "release-out/viabedrockutility-1.0.0+26.2-safe.jar"

      - name: Build the blocks variant
        run: |
          set -eu
          git checkout --force origin/feature/custom-blocks
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon --stacktrace
          ls -l build/libs
          jar=""
          for candidate in build/libs/*.jar; do
            case "$candidate" in
              *-sources.jar|*-dev.jar|*-dev-shadow.jar|*-sources-dev.jar) continue ;;
            esac
            jar="$candidate"
          done
          test -n "$jar"
          cp "$jar" "release-out/viabedrockutility-1.0.0+26.2-blocks.jar"
          ls -l release-out

      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#release-experimental/}"
          notes="Experimental builds for Minecraft 26.2. Both need ViaFabricPlus. The safe jar contains only what is known to work: the startup crash fix, the custom payload fix, capes, skins and custom entities. The blocks jar adds the experimental custom blocks on top of it. The stable 1.0.0 release is untouched by both jars."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-out/*.jar --clobber
          else
            gh release create "$tag" release-out/*.jar --target "$GITHUB_SHA" --title "ViaBedrockUtility $tag" --prerelease --notes "$notes"
          fi
          gh release view "$tag"
